services:
  - type: web
    name: discord-ai-agent
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLIENT_ID
        value: 1567044332664520744
      - key: GUILD_ID
        value: 1567043769860104322
      - key: OWNER_ID
        value: 670550091953733632
      - key: DEFAULT_MODEL
        value: openrouter/auto
      - key: DATABASE_URL
        sync: false
    autoDeploy: true
